<!DOCTYPE html>
<html lang="en" class="dark" style="color-scheme: dark; background-color: #020617; color: #ffffff;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Disqus Comments</title>
  <style>
    :root {
      color-scheme: dark;
    }
    html, body {
      margin: 0;
      padding: 4px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #020617;
      color: #ffffff;
      color-scheme: dark;
    }
    #disqus_thread {
      min-height: 240px;
      width: 100%;
      color-scheme: dark;
      color: #ffffff !important;
    }
    #disqus_thread iframe {
      color-scheme: dark;
    }
  </style>
  <script>
    // Suppress third-party cross-origin tracker warnings inside the iframe
    window.onerror = function() { return true; };
    window.addEventListener('error', function(e) { e.preventDefault(); return true; }, true);
    window.addEventListener('unhandledrejection', function(e) { e.preventDefault(); return true; }, true);
  </script>
</head>
<body>
  <div id="disqus_thread"></div>
  <script>
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var shortname = (params.get('shortname') || 'totoro-2').replace(/[^a-zA-Z0-9_-]/g, '');
        var locId = (params.get('id') || 'default').replace(/[^a-zA-Z0-9_-]/g, '');
        var locTitle = params.get('title') || 'Comments';

        window.disqus_config = function () {
          // Stable canonical URL & unique identifier per thread/topic
          this.page.url = window.location.origin + '/location/' + encodeURIComponent(locId);
          this.page.identifier = 'disqus-topic-' + encodeURIComponent(locId);
          this.page.title = locTitle;
          this.language = 'en_US'; // US English configuration
        };

        var d = document, s = d.createElement('script');
        s.src = 'https://' + shortname + '.disqus.com/embed.js';
        s.setAttribute('data-timestamp', +new Date());
        (d.head || d.body).appendChild(s);
      } catch (e) {
        console.warn('Disqus load notice:', e);
      }
    })();
  </script>
</body>
</html>
